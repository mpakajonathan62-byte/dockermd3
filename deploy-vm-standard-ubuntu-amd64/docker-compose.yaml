name: MDriven

services:
  server-core:
    platform: linux/amd64
    image: mpakajonathan/mdriven-server:ubuntu-amd64

    volumes:
      - type: volume
        source: MDSData
        target: /app

      - type: bind
        source: ./settings/mdriven-server/CommandLineOverride.xml
        target: /app/App_Data/CommandLineOverride.xml
      
      - type: bind
        source: ./settings/mdriven-server/DatabaseVistaDB.vdb6
        target: /app/App_Data/DatabaseVistaDB.vdb6
    
    environment:
      - PUID=1000
      - PGID=1000
    
    restart: unless-stopped
    entrypoint: ["/bin/sh","/usr/local/bin/entrypoint.sh"]
    command: ["dotnet", "AppCompleteGenericCore.dll"]

  turnkey-core:
    platform: linux/amd64
    image: mpakajonathan/mdriven-turnkey:ubuntu-amd64
    
    volumes:
      - type: volume
        source: MDTData
        target: /app

      - type: bind
        source: ./settings/mdriven-turnkey/CommandLineOverride.xml
        target: /app/App_Data/CommandLineOverride.xml
      
      - type: bind
        source: ./settings/mdriven-turnkey/HardServerUrl.xml
        target: /app/App_Data/HardServerUrl.xml
      
      - type: bind
        source: ./settings/mdriven-turnkey/MDrivenServerOverride.xml
        target: /app/App_Data/MDrivenServerOverride.xml
      
      - type: bind
        source: ./settings/mdriven-turnkey/TurnkeySettingsOverride.xml
        target: /app/App_Data/TurnkeySettingsOverride.xml
    
    depends_on:
      server-core:
        condition: service_started
        restart: true

    environment:
      - PUID=1000
      - PGID=1000
    
    restart: unless-stopped
    entrypoint: ["/bin/sh","/usr/local/bin/entrypoint.sh"]
    command: ["dotnet", "StreaminAppCoreWebApp.dll"]
   
  scm:
    image: lscr.io/linuxserver/code-server:4.109.2-ls317
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=123456
      - DEFAULT_WORKSPACE=/config/workspace
      - PWA_APPNAME=MDriven-Apps
      - PORT=8080
    
    volumes:
      - type: volume
        source: MDSData
        target: /config/workspace/MDrivenServer
      - type: volume
        source: MDTData
        target: /config/workspace/MDrivenTurnkey

  nginx:
    image: nginx:alpine
    depends_on:
      scm:
        condition: service_started
      turnkey-core:
        condition: service_started
        restart: true
    ports:
      - 5011:5011
      - 5012:5012
      - 8080:8080
    entrypoint: /bin/sh -c
    command: >
      "echo '
      server {
          listen 5011;
          location / {
              proxy_pass http://rentlyug-app-g81nkc-server-core-1:5011;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
          }
      }
      server {
          listen 5012;
          location / {
              proxy_pass http://rentlyug-app-g81nkc-turnkey-core-1:80;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
          }
      }
      server {
          listen 8080;
          location / {
              proxy_pass http://rentlyug-app-g81nkc-scm-1:8080;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection \"upgrade\";
          }
      }' > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"

volumes:
  MDSData:
  MDTData:
