name: MDriven

services:
  server-core:
    platform: linux/amd64
    image: mpakajonathan/mdriven-server:ubuntu-amd64

    volumes:
      - type: volume
        source: MDSData
        target: /app

      - type: bind
        source: ${PROJECT_ROOT:-.}/settings/mdriven-server/CommandLineOverride.xml
        target: /app/App_Data/CommandLineOverride.xml
      
      - type: bind
        source: ${PROJECT_ROOT:-.}/settings/mdriven-server/DatabaseVistaDB.vdb6
        target: /app/App_Data/DatabaseVistaDB.vdb6
    
    environment:
      - PUID=1000
      - PGID=1000
    
    restart: unless-stopped
    entrypoint: ["/bin/sh","/usr/local/bin/entrypoint.sh"]
    command: ["dotnet", "AppCompleteGenericCore.dll"]

  turnkey-core:
    platform: linux/amd64
    image: mpakajonathan/mdriven-turnkey:ubuntu-amd64
    
    volumes:
      - type: volume
        source: MDTData
        target: /app

      - type: bind
        source: ${PROJECT_ROOT:-.}/settings/mdriven-turnkey/CommandLineOverride.xml
        target: /app/App_Data/CommandLineOverride.xml
      
      - type: bind
        source: ${PROJECT_ROOT:-.}/settings/mdriven-turnkey/HardServerUrl.xml
        target: /app/App_Data/HardServerUrl.xml
      
      - type: bind
        source: ${PROJECT_ROOT:-.}/settings/mdriven-turnkey/MDrivenServerOverride.xml
        target: /app/App_Data/MDrivenServerOverride.xml
      
      - type: bind
        source: ${PROJECT_ROOT:-.}/settings/mdriven-turnkey/TurnkeySettingsOverride.xml
        target: /app/App_Data/TurnkeySettingsOverride.xml
    
    depends_on:
      server-core:
        condition: service_started
        restart: true

    environment:
      - PUID=1000
      - PGID=1000
    
    restart: unless-stopped
    entrypoint: ["/bin/sh","/usr/local/bin/entrypoint.sh"]
    command: ["dotnet", "StreaminAppCoreWebApp.dll"]
   
  scm:
    image: lscr.io/linuxserver/code-server:4.109.2-ls317
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=123456
      - DEFAULT_WORKSPACE=/config/workspace
      - PWA_APPNAME=MDriven-Apps
      - PORT=8080
    
    volumes:
      - type: volume
        source: MDSData
        target: /config/workspace/MDrivenServer
        read_only: false
      - type: volume
        source: MDTData
        target: /config/workspace/MDrivenTurnkey
        read_only: false

  nginx:
    image: nginx:alpine
    # Using the inline config defined at the bottom of this file
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      scm:
        condition: service_started
      turnkey-core:
        condition: service_started
        restart: true
    ports:
      - 5011:5011
      - 5012:5012
      - 8080:8080

# Inline text injection block to replace external file mounts
configs:
  nginx_conf:
    inline: |
      server {
          listen 5011;
          location / {
              proxy_pass http://server-core:5011;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
          }
      }
      server {
          listen 5012;
          location / {
              proxy_pass http://turnkey-core:5012;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
          }
      }
      server {
          listen 8080;
          location / {
              proxy_pass http://scm:8080;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
          }
      }

volumes:
  MDSData:
  MDTData:
